name: CI de calidad (informativo)

# Este pipeline INFORMA, no bloquea: no hay branch protection, así que un PR
# con checks en rojo igual se puede mergear. Cada job es independiente (no hay
# `needs`) para que una etapa en rojo no oculte el resultado de las demás.
# En un equipo real, estos mismos checks se marcan como obligatorios para mergear.

on:
  push:
  pull_request:

env:
  NODE_VERSION: 22
  TZ: America/Montevideo

jobs:
  build-server:
    name: Build del servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Generar el cliente de Prisma
        run: npx prisma generate
        working-directory: server
      - name: Compilar el servidor
        run: npm run build

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Analizar el código con ESLint
        run: npm run lint

  tests:
    name: Tests (unit e integración)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Generar el cliente de Prisma
        run: npx prisma generate
        working-directory: server
      - name: Correr los tests
        run: npm test

  coverage:
    name: Cobertura con umbral (líneas 80 / ramas 40)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Generar el cliente de Prisma
        run: npx prisma generate
        working-directory: server
      - name: Medir cobertura y exigir el umbral
        run: npx jest --runInBand --coverage --coverageThreshold='{"global":{"lines":80,"branches":40}}'
        working-directory: server
      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-servidor
          path: server/coverage/
          if-no-files-found: ignore

  build-client:
    name: Build del cliente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar el cliente
        run: npm run build:client

  e2e:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        working-directory: server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium --workers=1
      - name: Guardar reporte y trazas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reporte
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
